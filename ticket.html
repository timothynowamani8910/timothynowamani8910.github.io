<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Ticket - Etania Mutoni</title>
	<link rel="icon" href="images/Etania25.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .ticket-container {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            border: 2px solid #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        
        .ticket-container .icon {
            font-size: 80px;
            margin-bottom: 15px;
        }
        
        .ticket-container .badge {
            display: inline-block;
            background: #FF1493;
            padding: 4px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .ticket-container h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .ticket-container h1 span {
            color: #FF1493;
        }
        
        .ticket-container .subtitle {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 25px;
        }
        
        .ticket-preview {
            background: #1a1a1a;
            border: 2px dashed #555;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 25px;
            position: relative;
        }
        
        .ticket-preview .event-name {
            font-size: 22px;
            font-weight: 700;
            color: #FF1493;
        }
        
        .ticket-preview .event-details {
            color: #aaa;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .ticket-preview .ticket-number {
            color: #666;
            font-size: 12px;
            margin-top: 15px;
            font-family: monospace;
            letter-spacing: 2px;
        }
        
        .btn-download {
            background: #FF1493;
            color: #fff;
            padding: 18px 50px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            display: inline-block;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(255, 20, 147, 0.35);
            width: 100%;
        }
        
        .btn-download:hover {
            background: #e0127e;
            transform: translateY(-3px);
            box-shadow: 0 10px 35px rgba(255, 20, 147, 0.5);
        }
        
        .btn-download:active {
            transform: scale(0.97);
        }
        
        .btn-download i {
            margin-right: 12px;
        }
        
        .file-info {
            color: #666;
            font-size: 13px;
            margin-top: 18px;
        }
        
        .file-info a {
            color: #FF1493;
            text-decoration: none;
        }
        
        .file-info a:hover {
            text-decoration: underline;
        }
        
        /* Download Status */
        .download-status {
            display: none;
            margin-top: 18px;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 15px 20px;
            border: 1px solid #333;
            text-align: left;
        }
        
        .download-status.show {
            display: block;
        }
        
        .download-status .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .download-status .status-row .file-name {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }
        
        .download-status .status-row .file-size {
            color: #888;
            font-size: 12px;
        }
        
        .download-status .progress-track {
            width: 100%;
            height: 6px;
            background: #2a2a2a;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .download-status .progress-track .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF1493, #ff6b9d);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        .download-status .status-text {
            color: #888;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .download-status .status-text.success {
            color: #4caf50;
        }
    </style>
</head>
<body>
    
    <div class="ticket-container">
        <div class="badge">🎟️ EXCLUSIVE</div>
        <div class="icon">🎫</div>
        <h1>Download Your <span>Ticket</span></h1>
        <p class="subtitle">Get ready for an unforgettable night with Etania Mutoni</p>
        
        <!-- Ticket Preview -->
        <div class="ticket-preview">
            <div class="event-name">🎵 Life of the Party Concert</div>
            <div class="event-details">
                📍 Hockey Grounds, Kampala<br>
                🕐 April 4, 2026 • 7:00 PM
            </div>
            <div class="ticket-number">#ETANIA-2026-0042</div>
        </div>
        
        <!-- Download Button -->
        <button onclick="forceDownload()" class="btn-download">
            ⬇️ Download Ticket
        </button>
        
        <!-- Download Status -->
        <div class="download-status" id="downloadStatus">
            <div class="status-row">
                <span class="file-name">📄 Etania_Ticket.pdf</span>
                <span class="file-size">2.4 MB</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text" id="statusText">Starting download...</div>
        </div>
        
        <div class="file-info">
            📄 PDF • 2.4 MB • <a href="#" onclick="previewTicket(); return false;">Preview Ticket</a>
        </div>
    </div>
    
    <script>
        function forceDownload() {
            // Show download status
            const status = document.getElementById('downloadStatus');
            const progress = document.getElementById('progressFill');
            const statusText = document.getElementById('statusText');
            
            status.classList.add('show');
            statusText.textContent = '⏳ Starting download...';
            progress.style.width = '0%';
            
            // Simulate download progress
            let progressValue = 0;
            const interval = setInterval(() => {
                progressValue += Math.random() * 8 + 2;
                if (progressValue >= 100) {
                    progressValue = 100;
                    clearInterval(interval);
                    statusText.textContent = '✅ Download complete!';
                    statusText.className = 'status-text success';
                    
                    // Trigger the actual download
                    performDownload();
                    
                    // Reset after 3 seconds
                    setTimeout(() => {
                        status.classList.remove('show');
                        statusText.className = 'status-text';
                        progress.style.width = '0%';
                    }, 3000);
                }
                progress.style.width = progressValue + '%';
                statusText.textContent = `⏳ Downloading... ${Math.round(progressValue)}%`;
            }, 150);
        }
        
        function performDownload() {
            // METHOD 1: Using fetch API to force download
            fetch('documents/ticket.pdf')
                .then(response => response.blob())
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Etania_Ticket.pdf';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                })
                .catch(() => {
                    // Fallback: Use direct link if fetch fails
                    const a = document.createElement('a');
                    a.href = 'documents/ticket.pdf';
                    a.download = 'Etania_Ticket.pdf';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });
        }
        
        function previewTicket() {
            window.open('documents/ticket.pdf', '_blank');
        }
    </script>
    
</body>
</html>
